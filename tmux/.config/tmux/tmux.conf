# Tmux Configuration — modernized
# Managed via GNU stow · XDG path: ~/.config/tmux/tmux.conf

# ===== General Settings =====

# Change prefix from Ctrl+b to Ctrl+a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Enable mouse support
set -g mouse on

# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer size
set -g history-limit 50000

# Display tmux messages for 4 seconds
set -g display-time 4000

# Refresh status bar more often
set -g status-interval 5

# Enable focus events (for vim/nvim)
set -g focus-events on

# Modern terminal with true colour support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -ga terminal-features ",xterm-256color:usstyle"

# Reduce escape time (critical for vim/nvim)
set -sg escape-time 0

# ===== Key Bindings =====

# Reload tmux config with prefix + r
bind r source-file "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/tmux.conf" \; display "Config reloaded!"

# Split panes using | and - (keeping current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Easy window navigation
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# ===== Copy Mode =====

# Use vim keybindings in copy mode
setw -g mode-keys vi

# tmux-yank handles cross-platform clipboard (macOS/Linux/WSL)
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel

# Paste with prefix + p
bind p paste-buffer

# ===== Plugins (via TPM) =====

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'catppuccin/tmux#v2.1.2'

# ===== Plugin Configuration =====

# tmux-resurrect
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# tmux-continuum
set -g @continuum-restore 'on'
set -g @continuum-boot 'on'        # macOS: auto-start tmux on login
set -g @continuum-save-interval '10'

# Catppuccin theme — Frappé (matches Ghostty and Starship)
set -g @catppuccin_flavor 'frappe'
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# Status bar layout using catppuccin modules
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_date_time}"
set -g @catppuccin_date_time_text " %b %d  %H:%M"

# ===== Initialize TPM (keep at very bottom) =====
run '~/.config/tmux/plugins/tpm/tpm'
